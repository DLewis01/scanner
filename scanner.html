<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expanding Circles Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const startX = () => width * 0.3;
    const centerX = () => width / 2;

    class ExpandingCircle {
      constructor(startX) {
        this.startX = startX;
        this.radius = 0;
        this.triggeredNext = false;
      }

      update() {
        this.radius += 2;
      }

      draw(ctx) {
        const center = this.startX + this.radius;
        ctx.beginPath();
        ctx.arc(center, height / 2, this.radius, 0, 2 * Math.PI);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      get rightEdge() {
        return this.startX + 2 * this.radius;
      }
    }

    const circles = [new ExpandingCircle(startX())];

    function drawCrosshairs() {
      ctx.strokeStyle = "red";
      ctx.lineWidth = 1;

      // Vertical center
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();

      // Horizontal center
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      drawCrosshairs();

      for (const circle of circles) {
        circle.update();
        circle.draw(ctx);

        if (
          !circle.triggeredNext &&
          circle.rightEdge >= centerX()
        ) {
          circle.triggeredNext = true;
          circles.push(new ExpandingCircle(startX()));
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    animate();
  </script>
</body>
</html>
